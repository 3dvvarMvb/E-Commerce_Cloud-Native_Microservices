server.port=8002

spring.application.name=order-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_db}
spring.datasource.username=${DB_USER:ecom_user}
spring.datasource.password=${DB_PASSWORD:ecom_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Downstream Catalog Microservice
catalog.service.url=http://${CATALOG_HOST:catalog-service}:${CATALOG_PORT:8001}
