apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-catalog-service
  labels:
    app: ecommerce-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-catalog
  template:
    metadata:
      labels:
        app: ecommerce-catalog
    spec:
      containers:
        - name: catalog-service
          image: ecommerce-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: MONGO_URI
              value: "mongodb://ecommerce-mongo:27017/catalog"
            - name: REDIS_HOST
              value: "ecommerce-redis"
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-catalog-service
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: ecommerce-catalog
